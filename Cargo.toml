[package]
name = "rusted_pdf"
version = "0.3.0"
edition = "2021"
description = "RustedPdf — a cross-platform PDF reader and highlighter built with GPUI"
license = "PolyForm-Noncommercial-1.0.0"
build = "build.rs"

[package.metadata.wix]
# No bundled licence RTF, so skip the EULA page.
eula = false

[[bin]]
name = "RustedPdf"
path = "src/main.rs"

[dependencies]
anyhow = "1"
directories = "5"
# UI framework (Zed's GPUI, from crates.io)
gpui = "0.2.2"
image = "0.25"
pdfium-render = "0.9.3"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Win32 shim for window drag + restore, which gpui doesn't expose on Windows
# when the titlebar is transparent (client-side decorations).
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "windef"] }
raw-window-handle = "0.6"
winreg = "0.52"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
opt-level = 3
